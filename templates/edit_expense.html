{% extends "base.html" %}
{% block title %}Edit Expense{% endblock %}

{% block content %}
<section class="card form-card">
    <h2>Edit Expense</h2>
    <form method="post">
        <label>Title
            <input type="text" name="title" required value="{{ expense['title'] }}">
        </label>
        <label>Amount
            <input type="number" name="amount" step="0.01" min="0.01" required value="{{ expense['amount'] }}">
        </label>
        <label>Category
            <select name="category" required>
                {% for c in categories %}
                    <option value="{{ c }}" {% if c == expense['category'] %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Date
            <input type="date" name="date" value="{{ expense['date'] }}" required>
        </label>
        <label>Note (optional)
            <textarea name="note" rows="3">{{ expense['note'] or '' }}</textarea>
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{{ url_for('index') }}" class="btn">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
